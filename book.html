    if (book.ebookUrl) {
      ebookLink.href = book.ebookUrl;
      ebookLink.style.display = '';
    } else {
      ebookLink.style.display = 'none';
    }

    const linksEl = document.getElementById('bookLinks');
    linksEl.innerHTML = '';
    const linkItems = [
      { text: '이 책이 만들어지기 까지의 과정', url: book.historyUrl },
      ...(book.press || [])
    ];
    linkItems.forEach((item) => {
      const li = document.createElement('li');
      if (item.url) {
        li.innerHTML = `<a href="${item.url}" target="_blank" rel="noopener">${item.text} <span aria-hidden="true">→</span></a>`;
      } else {
        li.innerHTML = `<span class="book-links-list__text">${item.text}</span>`;
      }
      linksEl.appendChild(li);
    });
  } else {
    document.getElementById('bookCoverLabel').textContent = '책 정보를 찾을 수 없습니다';
    document.getElementById('bookTitle').textContent = '책을 찾을 수 없습니다';
    document.getElementById('bookDesc').textContent = '출간 도서 목록으로 돌아가 다시 선택해주세요.';
    document.getElementById('bookBuyLink').style.display = 'none';
    document.getElementById('bookEbookLink').style.display = 'none';
    document.getElementById('bookLinks').innerHTML = '';
  }
</script>

</body>
</html>
