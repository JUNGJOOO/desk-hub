    "3": { title: "이모작", year: "2023", desc: "test", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "4": { title: "그렇게 떠났고 다시 만났다", year: "2021", desc: "TODO: 책 소개 문구를 입력하세요.", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "5": { title: "이번이 마지막 다음입니다", year: "2019", desc: "TODO: 책 소개 문구를 입력하세요.", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "6": { title: "우연히 그녀의 소식을 듣게 되었다", year: "2018", desc: "TODO: 책 소개 문구를 입력하세요.", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "7": { title: "그래도 당신은 아름답다", year: "2017", desc: "TODO: 책 소개 문구를 입력하세요.", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "8": { title: "정당한 살인교사", year: "2016", desc: "TODO: 책 소개 문구를 입력하세요.", historyUrl: "https://blog.naver.com/TODO/TODO" },
    "9": { title: "20대, 20대에게 길을 묻다", year: "2015", desc: "[20대, 20대에게 길을 묻다]는 대학졸업과 동시에 학자금대출의 무게를 실감하게 되고, 좋은 일자리를 찾기 위해 무한의 노력을 기울여야 하는 이들에게 어떤 도움을 줄 수 있을까를 고민한 결과를 책에 담았다. 저자는 동시대를 사는 같은 20대로서 현실적이고 실질적인 조언을 주기 위해 이미 성공한 사람들이 아닌, 현재 성공을 꿈꾸고 성공을 위해 노력하고 있는 젊은이들의 목소리를 책에 담고 있다.", historyUrl: "https://blog.naver.com/TODO/TODO" },

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const book = BOOKS[id];

  if (book) {
    document.title = `홍길동 — ${book.title}`;
    document.getElementById('bookCoverLabel').textContent = book.title;
    document.getElementById('bookYear').textContent = book.year;
    document.getElementById('bookTitle').textContent = book.title;
    document.getElementById('bookDesc').textContent = book.desc;
    // TODO: 실제 구매 링크가 있다면 교보문고 상품 URL로 직접 교체하세요.
    document.getElementById('bookBuyLink').href =
      'https://search.kyobobook.co.kr/search?keyword=' + encodeURIComponent(book.title);
    // TODO: 실제 집필 히스토리 블로그 글 URL로 교체하세요.
    document.getElementById('bookHistoryLink').href = book.historyUrl;
  } else {
    document.getElementById('bookCoverLabel').textContent = '책 정보를 찾을 수 없습니다';
    document.getElementById('bookTitle').textContent = '책을 찾을 수 없습니다';
    document.getElementById('bookDesc').textContent = '출간 도서 목록으로 돌아가 다시 선택해주세요.';
    document.getElementById('bookBuyLink').style.display = 'none';
    document.getElementById('bookHistoryLink').style.display = 'none';
  }
